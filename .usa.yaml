# USA suppressions and reviews for AutoDOC
# This file records human judgement for findings that cannot be resolved by code changes.
# Every entry needs a reason a stranger would accept.

version: 1

suppressions:
  # SEC-005: False positive - string concatenation for markdown generation, not SQL
  - rule: SEC-005
    reason: "The flagged line (engine.py:870) concatenates strings to generate a markdown report ('## Changed paths at update time'), not SQL queries. No database is used in this code path."
    scope: "scripts/doc-sync/engine.py:870"

  # SEC-025: Not applicable - no authentication system in this CLI tool
  - rule: SEC-025
    reason: "AutoDOC is a documentation governance CLI tool with no user authentication, registration, or login functionality. Password hashing is not applicable."

  # DATA-001: Not applicable - no database or ORM in this project
  - rule: DATA-001
    reason: "AutoDOC is a CLI tool for documentation governance. It has no database, ORM, or schema migrations. It operates on filesystem and git."

  # SUP-001: Not applicable - Python project uses pyproject.toml with direct dependencies
  - rule: SUP-001
    reason: "AutoDOC uses pyproject.toml with direct dependencies (no lockfile). Dependencies are pinned in pyproject.toml and installed via pip. No package-lock.json equivalent exists for this Python packaging approach."

  # SUP-008: The ${{ }} in env: block is correct usage - values passed via env and referenced as $VAR in run
  - rule: SUP-008
    reason: "The flagged occurrences are in `env:` blocks where GitHub Actions context expressions are the correct and only way to pass dynamic values. The run commands reference them as shell variables ($BASE), not inline ${{ }}. This is the recommended pattern per GitHub docs."
    scope: ".github/workflows/docs-guard.yml, .github/workflows/self-doc-check.yml"

  # REPO-006: Not applicable — AutoDOC reads no environment variables
  - rule: REPO-006
    reason: "AutoDOC reads no environment variables; the only configuration file is autodoc.toml. An .env.example listing zero variables would misrepresent the configuration contract, and the owner-recorded has_env declaration in autodoc.toml (with reason) already documents that fact for the fact system."

  # FND-011: Not applicable — no containerized runtime by design
  - rule: FND-011
    reason: "AutoDOC is a zero-dependency Python CLI distributed as a wheel; its runtime environment is any Python 3.11-3.15 interpreter and its dev environment is 'python -m venv .venv && pip install -e .[dev]' (README/QUICK-START), with .python-version pinning the interpreter. The repository deliberately ships no Dockerfile: the has_docker fact detector and the container-doc catalog type (DOC-A13-001) it gates stay inactive by owner-recorded design, and adding one would activate a catalog requirement that only the owner can decide to satisfy."

reviews:
  # SUP-005: Dependency vulnerability scanning - added audit job to CI
  - rule: SUP-005
    status: "addressed"
    reviewed: "2026-10-26"
    evidence: "Added 'audit' job to .github/workflows/docs-guard.yml that runs 'pip_audit --fail-on HIGH' via the [audit] extra. Runs on every PR and push."
    until: "2027-04-26"

  # SUP-022: SLSA provenance - not yet implemented
  - rule: SUP-022
    status: "deferred"
    reviewed: "2026-10-26"
    evidence: "SLSA provenance attestation not yet configured. Requires GitHub Artifact Attestations setup and sigstore/cosign integration in release workflow."
    until: "2027-04-26"

  # SUP-023: Verification Summary Attestation - not yet implemented
  - rule: SUP-023
    status: "deferred"
    reviewed: "2026-10-26"
    evidence: "Verification Summary Attestation requires SLSA provenance first. Deferred until SUP-022 is addressed."
    until: "2027-04-26"

  # SUP-024: Detached signature - not yet implemented
  - rule: SUP-024
    status: "deferred"
    reviewed: "2026-10-26"
    evidence: "Sigstore/cosign signing not yet configured for release artifacts."
    until: "2027-04-26"

  # REPO-003: No secrets in git history - gitleaks scan
  - rule: REPO-003
    status: "addressed"
    reviewed: "2026-11-04"
    evidence: "A 'Secret scan' job in .github/workflows/docs-guard.yml downloads gitleaks 8.30.1 from the pinned release, verifies the linux_x64 tarball SHA-256 (551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb), and scans the full history with 'gitleaks detect --source . --redact --no-banner --exit-code 1'. 'make secret-scan' runs the same scan locally and a manual pre-commit hook wraps it. The job is advisory, not a required check. A local gitleaks 8.30.1 scan of the full history found no leaks."
    until: "2027-05-04"

  # SUP-012: Default branch protection - verified
  - rule: SUP-012
    status: "addressed"
    reviewed: "2026-11-04"
    evidence: "Live ruleset 'main' verified on 2026-11-04: rules deletion, non_fast_forward and required_status_checks (context 'AutoDOC guard / check', strict_required_status_checks_policy true), with no bypass actors. No required-review rule exists: the owner is the only maintainer and GitHub does not allow self-approval, so requiring review would deadlock merges. Status checks and no-force-push are the enforced controls."
    until: "2027-05-04"

  # AI-003: Least privilege for agents - documented
  - rule: AI-003
    status: "addressed"
    reviewed: "2026-11-04"
    evidence: "AGENTS.md now has a 'Forbidden actions' section naming tags and publishing, force-push and history deletion, state deletion, branch-protection changes, secret access, outbound messages, PR approval on the owner's behalf, and runtime dependency additions. Each requires approval of that specific action, not a session or category."
    until: "2027-05-04"

  # AI-010: Human confirmation for consequential actions - documented
  - rule: AI-010
    status: "addressed"
    reviewed: "2026-11-04"
    evidence: "AGENTS.md now has a 'Human confirmation' section: ask before irreversible or outbound actions, state what changes and whether an undo exists, and stop if the owner has not answered. Approval covers one named action, not a session or category."
    until: "2027-05-04"