[project]
name = "autodoc"
version = "0.3.0"
description = "Dependency-free documentation governance CLI and generation engine"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.16"
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/STEMORG2026/AutoDOC"
Repository = "https://github.com/STEMORG2026/AutoDOC"
Issues = "https://github.com/STEMORG2026/AutoDOC/issues"

[project.scripts]
autodoc = "autodoc.cli:main"

[project.optional-dependencies]
dev = ["build>=1,<2", "pytest>=8,<10", "pre-commit>=3,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expressions
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["autodoc"]
