# Canonical repository verification is make ci; artifacts retain actual unsigned run output.
name: AutoDOC guard
on:
  pull_request:
  push:
  workflow_dispatch:
jobs:
  compatibility:
    name: Python compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tested development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests on this supported Python version
        run: make test
  check:
    # GitHub matches a required status check by the job's name, not by "workflow / job"; the UI
    # shows the workflow prefix, the API context does not. The name is also what
    # scripts/doc-control/require-docs-check.py puts in the branch-protection payload, and it is
    # deliberately unique so another workflow's job cannot satisfy the requirement by name.
    name: AutoDOC guard / check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install tested development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Canonical docs, phase-scaled enforcement, impact, tests and evidence verification
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/master' }}
        run: make ci
      - name: Upload actual test-run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autodoc-test-evidence
          path: evidence/out/test-evidence.json
          if-no-files-found: ignore
      - name: Upload scoped evidence pack
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autodoc-evidence-pack
          path: evidence/out/
          if-no-files-found: ignore
      - name: Check review and living-state impact on PRs
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/intelligence/change_analyzer.py --base "$BASE"
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Upgrade setuptools (runner has 79.0.1 with known vulns)
        run: python -m pip install -U 'setuptools>=84.2.1'
      - name: Install audit dependencies
        run: python -m pip install -e '.[audit]'
      - name: Run dependency vulnerability scan
        run: make audit
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned and checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan the full history for secrets
        run: make secret-scan
