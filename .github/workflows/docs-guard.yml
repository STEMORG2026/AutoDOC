# Canonical repository verification is make ci; artifacts retain actual unsigned run output.
name: AutoDOC guard
on:
  pull_request:
  push:
  workflow_dispatch:
jobs:
  compatibility:
    name: Python compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tested development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests on this supported Python version
        run: make test
  check:
    # GitHub matches a required status check by the job's name, not by "workflow / job"; the UI
    # shows the workflow prefix, the API context does not. The name is also what
    # scripts/doc-control/require-docs-check.py puts in the branch-protection payload, and it is
    # deliberately unique so another workflow's job cannot satisfy the requirement by name.
    name: AutoDOC guard / check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install tested development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Canonical docs, phase-scaled enforcement, impact, tests and evidence verification
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/master' }}
        run: make ci
      - name: Upload actual test-run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autodoc-test-evidence
          path: evidence/out/test-evidence.json
          if-no-files-found: ignore
      - name: Upload scoped evidence pack
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autodoc-evidence-pack
          path: evidence/out/
          if-no-files-found: ignore
      - name: Check review and living-state impact on PRs
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/intelligence/change_analyzer.py --base "$BASE"
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install audit dependencies
        run: python -m pip install -e '.[audit]'
      - name: Run dependency vulnerability scan
        run: python -m pip_audit --progress-spinner off --fail-on HIGH
