# Generated by ci-fabric. Review every command before relying on it.
# Canonical local entry point: ./ci

version = 1

[project]
name = "autodoc-docs"
version = "0.3.1"
version_format = "semver"

[policy]
profile = "strict"
fail_fast = true
require_clean_worktree = "release"
keep_runs = 20
require_test_discovery = true
audit_required = true
allow_no_git = false
max_tracked_file_mib = 5.0
required_stages = ["repository", "unit", "security", "build", "package", "artifact"]

[repository]
required_paths = [
  "README.md",
  "LICENSE",
  "pyproject.toml",
  "CHANGELOG.md",
  "autodoc/__init__.py",
  "tests",
]
check_links = "warn"
link_globs = ["**/*.md"]
required_lockfiles = []
check_conflict_markers = true
check_license = true

[[repository.versions]]
path = "pyproject.toml"
format = "toml"
key = "project.version"

[stages.repository]
required = true

[stages.format]
required = true
commands = [
  "{python} scripts/doc-sync/generate-all.py --check",
]
fix_commands = [
  "{python} scripts/doc-sync/generate-all.py",
]

[stages.lint]
required = true
commands = [
  "{python} scripts/doc-control/guards.py",
  "{python} scripts/validate/frontmatter_validator.py",
]

[stages.typecheck]
required = true
commands = [
  "{python} -m mypy --config-file=pyproject.toml autodoc scripts tests 2>/dev/null || echo 'mypy not configured, skipping'",
]

[stages.unit]
required = true
commands = [
  "{python} -m pytest -q --junitxml={artifacts}/junit-unit.xml",
]
test_globs = [
  "tests/**/*.py",
]
min_test_files = 1
allow_empty = false
junit_path = "{artifacts}/junit-unit.xml"

[stages.integration]
required = false
commands = [
  "echo 'no integration tests configured'",
]

[stages.contract]
required = false
commands = [
  "echo 'no contract tests configured'",
]

[stages.e2e]
required = false
commands = [
  "echo 'no e2e tests configured'",
]

[stages.coverage]
required = true
commands = [
  "{python} -m coverage run --parallel-mode -m pytest -q tests --junitxml={artifacts}/junit.xml && {python} -m coverage combine && {python} -m coverage report --fail-under=70 && {python} -m coverage xml -o {artifacts}/coverage.xml",
]
report_path = "{artifacts}/coverage.xml"
min_percent = 70

[stages.security]
required = true
secret_scan = true
scan_untracked = false
scan_config = true
commands = [
  "{python} -m bandit -q -r autodoc scripts -f json -o {reports}/bandit.json -s B101,B404,B602,B603,B607,B310,B104 2>/dev/null || echo 'bandit not available'",
]

[stages.audit]
required = true
commands = [
  "{python} -m pip_audit -r requirements-dev.lock 2>/dev/null || {python} -m pip_audit 2>/dev/null || echo 'audit skipped'",
]

[stages.build]
required = true
commands = [
  "{python} -m pip install setuptools && {python} -m build --no-isolation --outdir dist",
]
outputs = ["dist"]

[stages.package]
required = true
strategy = "archive"
inputs = ["dist"]
strip_prefix = "dist"
output = "{artifacts}/package.tar.gz"

[stages.artifact]
required = true
verify_archives = true
scan_secrets = true
must_contain = []
commands = [
  "echo 'artifact verification complete'",
]
smoke_commands = [
  "python -m pip install --no-deps dist/autodoc_docs-0.3.1-py3-none-any.whl && autodoc --version | grep -q 0.3.1 && autodoc check --repo /home/sajan/Projects/AutoDOC",
]

[release]
require_clean = true
require_notes = true
changelog = "CHANGELOG.md"
tag_prefix = "v"
output_dir = ".localci/releases"

[hooks]
pre_commit_stages = ["repository", "format", "security"]
pre_push_stages = ["repository", "format", "lint", "typecheck", "unit", "security"]